name: PCP B2B cover overlay - one-time 20 product test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pcp-b2b-overlay-test.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Make actual changes to the fixed 20 test products'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pcp-b2b-cover-overlay-test
  cancel-in-progress: false

jobs:
  test-20:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: pip install 'Pillow>=10,<13' 'requests>=2.31,<3'
      - name: Add 1 new cover per product, keep original 3 images unchanged
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_SHOP: 72b63e-9f.myshopify.com
          APPLY_20: ${{ github.event_name == 'push' || inputs.apply == true }}
          TEST_LIMIT: '20'
        run: |
          if [ "$APPLY_20" = "true" ]; then export APPLY_20=1; else export APPLY_20=0; fi
          python pcp_b2b_overlay_test.py
      - name: Preserve result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcp-b2b-overlay-20-test-report
          path: pcp_b2b_overlay_test_report.json
          if-no-files-found: warn
