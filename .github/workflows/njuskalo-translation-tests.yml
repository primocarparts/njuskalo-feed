name: Njusaklo Croatian Description Tests
on:
  push:
    paths:
      - PrimoNjusaklo_DAILY_STOCK_SYNC.py
      - tests/**
      - .github/workflows/njuskalo-translation-tests.yml
  pull_request:
    paths:
      - PrimoNjusaklo_DAILY_STOCK_SYNC.py
      - tests/**
      - .github/workflows/njuskalo-translation-tests.yml

jobs:
  translation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
